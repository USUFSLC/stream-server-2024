version: '3'

services:
   nginx:
      restart: "always"
      build:
         dockerfile: Dockerfile
         context: ./nginx
      ports:
         - "8080:80"
         - "1935:1935"
      environment:
         - "RTMP_PORT: 1935"
      volumes:
         - "./nginx/nginx.conf:/etc/nginx/nginx.conf.template"
         - "./nginx/scripts:/scripts"
         - "./media:/var/stream:rw"
      depends_on:
         - fslc-stream
   fslc-stream:
      restart: "always" 
      build:
         dockerfile: ./Dockerfile
      environment:
         AUTOMIGRATE: 1
      env_file:
         - .postgres.env
         - .flask.env
      ports:
         - "5000:5000"
      volumes:
         - "./gunicorn.conf.py:/etc/gunicorn.conf.py"
         - "./migrations:/fslc-stream/migrations"
      depends_on:
         - postgres
   postgres:
      restart: "always"
      image: "docker.io/postgres:17-alpine"
      env_file: .postgres.env
      ports:
        - '5432:5432'
      volumes:
         - "postgres-data:/var/lib/postgresql/data"

volumes:
   postgres-data:
