daemon off;

error_log /dev/stdout info;

user root root;

events {
	worker_connections 1024;
}

rtmp {
	server {
		listen 1935;
		chunk_size 4096;
		application live {
			live on;
			hls on;
			hls_fragment 4s;
			hls_playlist_length 4s;
			hls_path /var/stream/hls/;
			hls_continuous on;

			deny play all;
			record all;
			record_path /var/stream/recordings;
			record_unique off;

			#on_publish http://fslc-stream:5000/api/rtmp/start;
			#on_publish_done http://fslc-stream:5000/api/rtmp/end;

			drop_idle_publisher 10s;
			idle_streams off;

			#notify_update_timeout 10s;
			#notify_update_strict on;
			#on_update http://fslc-stream:5000/api/rtmp/update;

			exec_static /scripts/static.sh;
			exec_record_done /scripts/record_done.sh $path;
		}
	}
}

http {
	server {
		listen      80;

		location /hls/ {
			add_header 'Access-Control-Allow-Origin' '*' always;
			add_header 'Access-Control-Expose-Headers' 'Content-Length';

			# allow CORS preflight requests
			if ($request_method = 'OPTIONS') {
				add_header 'Access-Control-Allow-Origin' '*';
				add_header 'Access-Control-Max-Age' 1728000;
				add_header 'Content-Type' 'text/plain charset=UTF-8';
				add_header 'Content-Length' 0;
				return 204;
			}
			types {
				application/vnd.apple.mpegurl m3u8;
				video/mp2t ts;
				video/mp4 mp4;
			}
			alias /var/stream/hls/;
			autoindex on;
		}

		location /vod/ {
			types {
				video/mp4  mp4;
			}
			alias /var/stream/recordings/;
			autoindex on;
		}
	}
}
